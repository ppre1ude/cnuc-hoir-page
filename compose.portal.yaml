name: choir-portal

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: choir
      MYSQL_USER: choir
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 환경 변수가 필요합니다}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 환경 변수가 필요합니다}
    volumes:
      - portal_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - api_private

  api:
    build: ./api
    environment:
      DB_URL: jdbc:mysql://mysql:3306/choir
      DB_USER: choir
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 환경 변수가 필요합니다}
      TRUSTED_PROXY_CIDRS: ${E2E_PROXY_IP:-172.30.240.10}/32
      REQUIRE_TRUSTED_PROXY: "true"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - api_private

  web:
    build: ./web
    networks:
      - web_private

  proxy:
    image: nginx:stable-alpine
    volumes:
      - ./deployment/nginx/portal.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    ports:
      - "127.0.0.1:${PORTAL_HTTP_PORT:-8080}:80"
    networks:
      api_private:
        ipv4_address: ${E2E_PROXY_IP:-172.30.240.10}
      web_private:
      edge:

volumes:
  portal_mysql_data:

networks:
  api_private:
    internal: true
    ipam:
      config:
        - subnet: ${E2E_API_PRIVATE_SUBNET:-172.30.240.0/24}
  web_private:
    internal: true
  edge:
