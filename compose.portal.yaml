name: choir-portal

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: choir
      POSTGRES_USER: choir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 환경 변수가 필요합니다}
    volumes:
      - portal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc 'SELECT 1' | grep -qx 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - api_private

  api:
    build: ./api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/choir
      DB_USER: choir
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 환경 변수가 필요합니다}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      TRUSTED_PROXY_CIDRS: ${E2E_PROXY_IP:-172.30.240.10}/32
      REQUIRE_TRUSTED_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - api_private

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    networks:
      - web_private

  proxy:
    image: nginx:stable-alpine
    volumes:
      - ./deployment/nginx/portal.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    ports:
      - "127.0.0.1:${PORTAL_HTTP_PORT:-8080}:80"
    networks:
      api_private:
        ipv4_address: ${E2E_PROXY_IP:-172.30.240.10}
      web_private:
      edge:

volumes:
  portal_postgres_data:

networks:
  api_private:
    internal: true
    ipam:
      config:
        - subnet: ${E2E_API_PRIVATE_SUBNET:-172.30.240.0/24}
  web_private:
    internal: true
  edge:
