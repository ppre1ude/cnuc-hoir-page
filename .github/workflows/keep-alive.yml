name: keep-alive

# Supabase 무료 프로젝트는 일주일 동안 DB 활동이 없으면 일시중지됩니다.
# 하루 두 번 API의 CSRF 준비 요청을 보내면 세션 한 줄이 DB에 기록돼 활동으로 집계됩니다.
on:
  schedule:
    - cron: "0 6,18 * * *" # UTC. 한국 시간 15:00, 03:00
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: API를 거쳐 DB에 세션 한 줄을 남긴다
        run: |
          # 잠든 서버는 첫 요청이 늦게 끊길 수 있어 두 번 더 시도합니다.
          status=$(curl -sS -o /dev/null -m 120 --retry 2 --retry-delay 30 \
            -w '%{http_code}' https://cnuc-hoir-page.vercel.app/api/v1/auth/csrf)
          echo "csrf status=$status"
          test "$status" = "200"
