spring:
  application:
    name: choir
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/postgresql
  session:
    # 마지막 요청 뒤 7일 동안 로그인을 유지합니다. 주 1회 연습이어도 출석할 때 다시 로그인하지 않게 하려는 값입니다.
    timeout: 7d
    jdbc:
      initialize-schema: never
choir:
  security:
    trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:}
    require-trusted-proxy: ${REQUIRE_TRUSTED_PROXY:false}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        # 쿠키는 로그인할 때만 새로 쓰므로 세션보다 길게 둬, 브라우저를 닫아도 남고 7일 유지는 서버 세션이 정합니다.
        # 그래서 계속 쓰더라도 로그인 30일 뒤에는 한 번 다시 로그인합니다.
        max-age: 30d
        http-only: true
        secure: true
        same-site: lax
