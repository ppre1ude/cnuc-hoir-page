spring:
  application:
    name: choir
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/postgresql
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
choir:
  security:
    trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:}
    require-trusted-proxy: ${REQUIRE_TRUSTED_PROXY:false}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
