spring:
  application:
    name: choir
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
