services:
  - type: web
    name: cnuc-hoir-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    buildFilter:
      paths:
        - api/**
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: 676346594101-0c7542kbvqr4q3h1sfl37qqocu0rucfe.apps.googleusercontent.com
